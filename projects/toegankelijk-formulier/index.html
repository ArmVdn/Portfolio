<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aanmeldformulier | Armine Vardanyan</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <a href="../../index.html#accessibility"> Terug naar mijn portfolio </a>
    </header>

    <main id="main">
      <h1>Formulierdemo</h1>
      <p>Een demonstratieproject voor mijn portfolio.</p>
      <form id="workshop-form">
        <div>
          <label for="full-name">Naam (verplicht)</label>
          <input
            type="text"
            id="full-name"
            name="name"
            autocomplete="name"
            required
          />
        </div>

        <div>
          <label for="email">E-mailadres (verplicht)</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <p>Dit is een oefenformulier. Er vindt geen echte aanmelding plaats.</p>

        <button type="submit">Aanmelding controleren</button>

        <p id="form-status" role="status"></p>
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
